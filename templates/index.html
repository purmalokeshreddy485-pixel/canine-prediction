<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Canine Breed Predictor</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="card-title mb-3">Canine Breed Predictor 🐶</h2>

              <div id="dropzone" class="border rounded p-4 text-center mb-3">
                <p class="mb-2">Drag & drop an image here, or</p>
                <input id="fileInput" type="file" name="file" accept="image/*" class="form-control-file" hidden>
                <button id="browseBtn" class="btn btn-primary">Browse</button>
                <div id="previewWrapper" class="mt-3 d-none">
                  <img id="preview" src="#" alt="preview" class="img-fluid rounded" style="max-height:300px;">
                </div>
              </div>

              <div class="d-grid gap-2">
                <button id="predictBtn" class="btn btn-success btn-lg">Predict</button>
              </div>

              <div id="spinner" class="text-center mt-3 d-none">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-2">Running model...</p>
              </div>

              <div id="results" class="mt-4 d-none">
                <h5>Top Predictions</h5>
                <ul id="resultsList" class="list-group"></ul>
                <p class="mt-3"><a href="#" id="tryAgain">Try another image</a></p>
              </div>

            </div>
          </div>
          <p class="text-muted small mt-3">Note: images are resized to 256×256 and normalized to match model preprocessing.<br>enter only dog images!!</p>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
