<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Prediction Result</title>
  </head>
  <body>

    <h1>Prediction: <strong>{{ label }}</strong></h1>

    <h3>
      Breed Type:
      <span style="
        padding:6px 12px;
        border-radius:6px;
        color:white;
        background-color: {{ 'green' if breed == 'local' else 'orange' }};
      ">
        {{ breed|upper }}
      </span>
    </h3>

    <img src="{{ url_for('static', filename='uploads/' ~ filename) }}"
         alt="Uploaded image"
         style="max-width:400px;display:block;margin-top:20px;">

    <p><a href="{{ url_for('index') }}">Try another image</a></p>

  </body>
</html>
